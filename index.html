<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jahrmarkt Rennen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🏇 Großes Derby 🏇</h1>
        
        <div id="setup">
            <div class="setup-group">
                <label>Schwierigkeit:</label>
                <select id="difficultySelect">
                    <option value="easy">Leicht</option>
                    <option value="medium" selected>Mittel</option>
                    <option value="hard">Schwer</option>
                </select>
            </div>

            <div class="setup-group">
                <input type="checkbox" id="multiplayerToggle">
                <label for="multiplayerToggle">2 Spieler</label>
            </div>

            <div class="setup-group">
                P1 Taste: <input type="text" id="keyInput1" maxlength="1" placeholder="_" readonly class="key-box">
                <span id="p2-setup" style="display:none; margin-left:10px;">
                    P2 Taste: <input type="text" id="keyInput2" maxlength="1" placeholder="_" readonly class="key-box">
                </span>
            </div>

            <button id="startBtn" disabled>START</button>
        </div>

        <h2 id="statusText">Bereit machen...</h2>

        <div class="race-track">
            
            <img src="pferd.gif" class="horse" id="horse-p1" alt="Pferd P1">

            <img src="pferd.gif" class="horse" id="horse-lane2" alt="Pferd Spur 2">

            <img src="pferd.gif" class="horse" id="horse-ai2" alt="Pferd KI 2">

            <img src="pferd.gif" class="horse" id="horse-ai3" alt="Pferd KI 3">

        </div> 

        <div class="hud-dashboard">
            <div class="hud-box">
                <h3>Wetteinsatz</h3>
                Guthaben: <span id="moneyDisplay">1000</span> $<br>
                Einsatz: <input type="number" id="betInput" value="100" style="width:60px;"> $
            </div>
            <div class="hud-box">
                <h3>Letzte Rennen</h3>
                <ul id="scoreList"><li>Noch keine Daten</li></ul>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
